    <script>
      /**
       * Boot, inline and synchronous so the theme is resolved before first
       * paint — no flash on load (the brief §8.1). localStorage holds the theme
       * preference and nothing else (the brief §4.8).
       *
       * `js` on <html> is what switches reveal animations from "visible" to
       * "hidden until revealed", so a reader without JS keeps the whole page.
       */
      (function () {
        var root = document.documentElement;
        root.classList.add('js');
        var stored = null;
        try {
          stored = localStorage.getItem('theme');
        } catch (e) {
          /* private mode, storage disabled — fall through to the OS setting */
        }
        var theme =
          stored === 'light' || stored === 'dark'
            ? stored
            : window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark';
        root.setAttribute('data-theme', theme);
      })();
    </script>
