# Netlify builds the site with its Next.js runtime, declared below so it always
# runs (without it, Netlify publishes .next as plain files and every page 404s).
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  # Stories runs on Supabase. Both values are public by design: they ship in
  # the browser, and the database's row-level security protects the data.
  NEXT_PUBLIC_SUPABASE_URL = "https://ydrnqsbuxgdxxlrmmrze.supabase.co"
  NEXT_PUBLIC_SUPABASE_ANON_KEY = "sb_publishable_Hx_tflvkn44yZVifuHRKjQ_uXT6a_jN"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# The Blazify apps read these; never cache them for long.
[[headers]]
  for = "/blazify/*.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Photos, logos and illustrations: their names don't change
# with their content, so browsers keep them a day and then, while checking in
# the background for a new one, keep showing the copy they have for a week.
# (Netlify's default made every visit ask the server about each image again.)
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"
[[headers]]
  for = "/logos/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"
[[headers]]
  for = "/illustrations/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"
# Icons: each address carries a hash of the file's contents (?v=, see
# components/Icon.tsx), so browsers can keep them for good.
[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
